<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi viaje | Viaja Sin Estrés</title>
  <meta name="description" content="Consultá toda la información de tu viaje con Viaja Sin Estrés.">
  <link rel="stylesheet" href="../shared/css/global.css">
<link rel="icon" href="../assets/favicon-viaja-sin-estres.svg" type="image/svg+xml">
  <style>
    :root {
      --navy: #0b2941;
      --blue: #123b5d;
      --gold: #f2b84b;
      --background: #f5f8fb;
      --surface: #fff;
      --text: #183247;
      --muted: #66788a;
      --border: #e1e9f0;
      --shadow: 0 16px 45px rgba(11, 41, 65, .09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; }

    .container {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 78px;
    }

    .logo {
      display: block;
      width: 185px;
      height: auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 17px;
      border-radius: 999px;
      background: #fff5dc;
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
    }

    main { padding: 38px 0 80px; }

    .loading,
    .message {
      padding: 70px 20px;
      text-align: center;
    }

    .message h1 { margin-bottom: 10px; color: var(--navy); }

    .hidden { display: none !important; }

    .hero {
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .hero-image {
      display: block;
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      background: #eef4f8;
    }

    .hero-content { padding: 38px; }

    .eyebrow {
      margin-bottom: 8px;
      color: #2671a7;
      font-size: .84rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 12px;
      color: var(--navy);
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: -.045em;
    }

    .dates {
      margin-bottom: 22px;
      color: var(--muted);
      font-weight: 700;
    }

    .description {
      max-width: 820px;
      color: #40576a;
      white-space: pre-line;
      line-height: 1.8;
    }

    .whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 25px;
      padding: 13px 22px;
      border-radius: 999px;
      background: #18a957;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    .whatsapp:hover {
      transform: translateY(-2px);
      background: #128b47;
    }

    .section {
      margin-bottom: 22px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 8px 28px rgba(11,41,65,.045);
    }

    .section h2 {
      margin-bottom: 20px;
      color: var(--navy);
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      line-height: 1.2;
    }

    .important {
      border-left: 6px solid var(--gold);
      background: #fffaf0;
    }

    .important p {
      white-space: pre-line;
      color: #5b4a28;
    }

    .item {
      position: relative;
      padding: 20px 0 20px 18px;
      border-bottom: 1px solid var(--border);
    }

    .item::before {
      position: absolute;
      top: 25px;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      content: "";
    }

    .item:first-child { padding-top: 0; }
    .item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .item-title {
      margin-bottom: 9px;
      color: var(--navy);
      font-size: 1.08rem;
      font-weight: 800;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .item p {
      margin: 5px 0;
      color: var(--muted);
      white-space: pre-line;
    }

    .tag {
      display: inline-block;
      margin: 0 7px 7px 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: #edf5fb;
      color: var(--blue);
      font-size: .84rem;
      font-weight: 700;
    }

    .file-group + .file-group { margin-top: 28px; }

    .file-group h3 {
      margin-bottom: 13px;
      color: var(--blue);
      font-size: 1.1rem;
    }

    .file-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
    }

    .file-card:last-child { border-bottom: 0; }

    .file-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .file-link {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 999px;
      background: #eaf3fb;
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
    }

    .public-image-card {
      margin-bottom: 18px;
    }

    .public-image-card img {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #f2f6f9;
    }

    .public-image-card p {
      margin-top: 7px;
      color: var(--muted);
      font-size: .9rem;
    }

    .footer {
      padding: 28px 0;
      background: var(--navy);
      color: rgba(255,255,255,.75);
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .footer strong { color: #fff; }

    @media (max-width: 650px) {
      .topbar-inner { min-height: 70px; }
      .logo { width: 155px; }
      .back-link { padding: 9px 13px; font-size: .88rem; }
      main { padding-top: 22px; }
      .hero-content,
      .section { padding: 23px; }

      .hero-image {
        max-height: 300px;
      }
      .file-card {
        align-items: flex-start;
        flex-direction: column;
      }
      .file-link { width: 100%; }
      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="../index.html" aria-label="Volver a Viaja Sin Estrés">
        <img class="logo" src="../assets/logo-viaja-sin-estres.png" alt="Viaja Sin Estrés">
      </a>
      <a class="back-link" href="../index.html">← Página principal</a>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading">Cargando información de tu viaje...</div>
    <div id="error" class="message hidden"></div>

    <div id="content" class="hidden">
      <section class="hero">
        <img id="mainImage" class="hero-image hidden" alt="Imagen principal del viaje">

        <div class="hero-content">
          <div class="eyebrow" id="destination"></div>
          <h1 id="title"></h1>
          <div class="dates" id="dates"></div>
          <div class="description" id="description"></div>

          <a
  href="https://api.whatsapp.com/send?phone=5493462377104&text=Hola%2C%20quisiera%20realizar%20una%20consulta%20sobre%20los%20servicios%20de%20Viaja%20Sin%20Estr%C3%A9s.%20%C2%BFPodr%C3%ADan%20ayudarme%3F"
  target="_blank"
  rel="noopener noreferrer"
  style="
    display: inline-block;
    padding: 14px 24px;
    background: #168c4b;
    color: #ffffff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    margin-top: 12px;
  "
>
  Contactar por WhatsApp
</a>
        </div>
      </section>

      <section id="importantSection" class="section important hidden">
        <h2>⚠️ Información importante</h2>
        <p id="importantInfo"></p>
      </section>

      <section id="activitiesSection" class="section hidden">
        <h2>🗓️ Itinerario</h2>
        <div id="activities"></div>
      </section>

      <section id="transfersSection" class="section hidden">
        <h2>🚐 Traslados</h2>
        <div id="transfers"></div>
      </section>

      <section id="noticesSection" class="section hidden">
        <h2>📢 Avisos importantes</h2>
        <div id="notices"></div>
      </section>

      <section id="filesSection" class="section hidden">
        <h2>📎 Archivos del viaje</h2>
        <div id="files"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <strong>Viaja Sin Estrés</strong>
      <small>Tu información de viaje, siempre a mano.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/supabaseClient.js"></script>

  <script>
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const content = document.getElementById("content");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(date) {
      if (!date) return "Fecha no especificada";

      return new Date(`${date}T12:00:00`).toLocaleDateString("es-AR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatTime(time) {
      if (!time) return "";
      const value = String(time).trim();
      const match = value.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
      if (!match) return value;
      return `${match[1].padStart(2, "0")}:${match[2]}`;
    }

    function capitalizeFirst(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function showError(title, message) {
      loading.classList.add("hidden");
      content.classList.add("hidden");
      errorBox.classList.remove("hidden");

      errorBox.innerHTML = `
        <h1>${escapeHtml(title)}</h1>
        <p>${escapeHtml(message)}</p>
      `;
    }

    function renderList(containerId, sectionId, items, renderer) {
      const container = document.getElementById(containerId);
      const section = document.getElementById(sectionId);

      if (!Array.isArray(items) || items.length === 0) return;

      container.innerHTML = items.map(renderer).join("");
      section.classList.remove("hidden");
    }

    async function buildFileUrl(item) {
      const client = window.supabaseClient || window.supabase || window._supabase;
      const bucket = item.bucket || "";
      const path = item.path_storage || item.path || "";

      if (!client || !bucket || !path) return "";

      // Los buckets "imagenes" y "documentos" están configurados como públicos.
      // Por eso usamos directamente su URL pública para ambos tipos de archivo.
      if (bucket === "imagenes" || bucket === "documentos" || item.es_privado === false) {
        const { data } = client.storage.from(bucket).getPublicUrl(path);
        return data?.publicUrl || "";
      }

      const { data, error } = await client.storage
        .from(bucket)
        .createSignedUrl(path, 3600);

      if (error) {
        console.error("No se pudo generar la URL del archivo:", error);
        return "";
      }

      return data?.signedUrl || "";
    }

    async function renderFiles(items) {
      const section = document.getElementById("filesSection");
      const container = document.getElementById("files");

      if (!Array.isArray(items) || items.length === 0) return;

      const images = items.filter(item => item.tipo === "imagen");
      const documents = items.filter(item => item.tipo === "pdf" || item.tipo === "documento");

      let output = "";

      if (images.length) {
        output += `<div class="file-group"><h3>🖼️ Imágenes</h3>`;

        for (const item of images) {
          const url = await buildFileUrl(item);
          if (url) {
            output += `
              <div class="public-image-card">
                <img src="${escapeHtml(url)}" alt="${escapeHtml(item.nombre || "Imagen del viaje")}">
                <p>${escapeHtml(item.nombre || "Imagen del viaje")}</p>
              </div>
            `;
          }
        }

        output += `</div>`;
      }

      if (documents.length) {
        output += `<div class="file-group"><h3>📄 Documentos</h3>`;

        for (const item of documents) {
          const url = await buildFileUrl(item);

          output += `
            <div class="file-card">
              <div class="file-name">📄 ${escapeHtml(item.nombre || "Documento")}</div>
              ${
                url
                  ? `<a class="file-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Abrir documento ↗</a>`
                  : `<span>Archivo no disponible</span>`
              }
            </div>
          `;
        }

        output += `</div>`;
      }

      if (output.trim()) {
        container.innerHTML = output;
        section.classList.remove("hidden");
      }
    }

    async function loadTrip() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("c");

      if (!code) {
        showError(
          "Viaje no encontrado",
          "El enlace no contiene un código de viaje válido."
        );
        return;
      }

      try {
        const client = window.supabaseClient || window.supabase || window._supabase;

        if (!client || typeof client.rpc !== "function") {
          throw new Error("No se pudo inicializar la conexión con Supabase.");
        }

        const { data, error } = await client.rpc(
          "obtener_viaje_publico",
          { p_codigo: code }
        );

        if (error) throw error;

        if (!data) {
          showError(
            "Viaje no disponible",
            "El viaje no existe, está inactivo o el enlace es incorrecto."
          );
          return;
        }

        const trip = Array.isArray(data) ? data[0] : data;

        document.getElementById("title").textContent = trip.titulo || "Mi viaje";
        document.getElementById("destination").textContent = trip.destino || "";
        document.getElementById("dates").textContent =
          `${formatDate(trip.fecha_inicio)} → ${formatDate(trip.fecha_fin)}`;
        document.getElementById("description").textContent =
          trip.descripcion || "No hay una descripción disponible.";

        if (trip.imagen_principal) {
          const image = document.getElementById("mainImage");
          image.src = trip.imagen_principal;
          image.classList.remove("hidden");
        }

        if (trip.info_importante) {
          document.getElementById("importantInfo").textContent = trip.info_importante;
          document.getElementById("importantSection").classList.remove("hidden");
        }

        renderList(
          "activities",
          "activitiesSection",
          trip.actividades,
          item => `
            <div class="item">
              <div class="item-title">${escapeHtml(item.titulo || item.nombre || "Actividad")}</div>
              <div class="item-meta">
                ${item.dia ? `<span class="tag">Día ${escapeHtml(item.dia)}</span>` : ""}
                ${item.lugar ? `<span class="tag">📍 ${escapeHtml(item.lugar)}</span>` : ""}
              </div>
              ${item.fecha ? `<p>📅 ${escapeHtml(formatDate(item.fecha))}</p>` : ""}
              ${item.hora ? `<p>🕒 ${escapeHtml(formatTime(item.hora))}</p>` : ""}
              ${item.descripcion ? `<p>${escapeHtml(item.descripcion)}</p>` : ""}
            </div>
          `
        );

        renderList(
          "transfers",
          "transfersSection",
          trip.traslados,
          item => `
            <div class="item">
              <div class="item-title">${escapeHtml(capitalizeFirst(item.titulo || item.tipo || "Traslado"))}</div>
              ${item.origen ? `<p>📍 Origen: ${escapeHtml(item.origen)}</p>` : ""}
              ${item.destino ? `<p>🏁 Destino: ${escapeHtml(item.destino)}</p>` : ""}
              ${item.fecha ? `<p>📅 ${escapeHtml(formatDate(item.fecha))}</p>` : ""}
              ${item.hora ? `<p>🕒 ${escapeHtml(formatTime(item.hora))}</p>` : ""}
              ${item.detalle ? `<p>${escapeHtml(item.detalle)}</p>` : ""}
              ${item.descripcion ? `<p>${escapeHtml(item.descripcion)}</p>` : ""}
            </div>
          `
        );

        renderList(
          "notices",
          "noticesSection",
          trip.avisos,
          item => `
            <div class="item">
              <div class="item-title">📢 Aviso</div>
              <p>${escapeHtml(item.mensaje || item.descripcion || "")}</p>
            </div>
          `
        );

        await renderFiles(trip.archivos);

        loading.classList.add("hidden");
        content.classList.remove("hidden");
      } catch (error) {
        console.error("Error al cargar el viaje:", error);
        showError(
          "No se pudo cargar el viaje",
          "Ocurrió un error al consultar la información. Revisá la conexión e intentá nuevamente."
        );
      }
    }

    loadTrip();
  </script>
</body>
</html>
