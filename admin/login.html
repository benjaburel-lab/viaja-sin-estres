<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Viajar Sin Estrés</title>
  <link rel="stylesheet" href="../shared/css/global.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="../assets/favicon-viaja-sin-estres.svg" type="image/svg+xml">
</head>

<body class="login-page">

  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
    <img
  src="../assets/logo-viaja-sin-estres.png"
  alt="Viaja Sin Estrés"
  class="brand-logo"
>

    <p>Panel de administración</p>
</div>
    <!-- Alerta de acceso denegado (solo si viene de requireAdmin) -->
    <div id="alert-unauthorized" class="alert alert-error hidden">
      Tu cuenta no tiene permisos de administrador.
      Contactá a soporte o verificá la configuración en Supabase.
    </div>

    <!-- Formulario de login -->
    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="mauro@ejemplo.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
          required>
      </div>

      <div id="login-error" class="alert alert-error hidden"></div>

      <button type="submit" id="btn-login" class="btn btn-primary btn-full btn-lg">
        Ingresar
      </button>

    </form>

  </div><!-- /login-card -->

  <!-- CDN de Supabase y configuración (deben cargarse ANTES de supabaseClient.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/supabaseClient.js"></script>

  <script>
    // ── Verificar error de acceso denegado desde requireAdmin ──
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'unauthorized') {
      document.getElementById('alert-unauthorized').classList.remove('hidden');
    }

    // ── Si ya hay sesión válida → ir directo al dashboard ──
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session && session.user?.app_metadata?.role === 'admin') {
        window.location.href = 'dashboard.html';
      }
    });

    // ── Submit del login ──
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btn-login');
      const errorEl = document.getElementById('login-error');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Limpiar errores previos
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      // Intentar login
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        // Mostrar error genérico (no revelar si el email existe o no)
        errorEl.textContent = 'Credenciales incorrectas. Verificá tu email y contraseña.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
        return;
      }

      // Login OK: verificar que sea admin antes de entrar al dashboard
      const role = data.session?.user?.app_metadata?.role;
      if (role !== 'admin') {
        await supabaseClient.auth.signOut();
        errorEl.textContent = 'Tu cuenta no tiene permisos de administrador.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
        return;
      }

      // Todo OK → dashboard
      window.location.href = 'dashboard.html';
    });
  </script>

</body>

</html>
